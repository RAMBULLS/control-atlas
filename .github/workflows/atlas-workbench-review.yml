name: Atlas workbench review

on:
  pull_request:
    paths:
      - '.github/workflows/atlas-workbench-review.yml'
      - 'src/**/atlasWorkbench*'
      - 'src/**/AtlasWorkbench*'
      - 'scripts/build-atlas-workbench.mjs'
      - 'tests/atlas-workbench*'
      - 'tests/e2e/atlas-workbench*'
      - 'styles/atlas-workbench.css'

permissions:
  contents: read

concurrency:
  group: atlas-workbench-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reproducible-review:
    if: github.head_ref == 'feat/atlas-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package a credential-free reproducible review workspace
        shell: bash
        run: |
          mkdir -p /tmp/atlas-review/runtime
          git archive --format=tar.gz -o /tmp/atlas-review/source.tar.gz HEAD
          tar -czf /tmp/atlas-review/dependencies.tar.gz node_modules
          cp "$(command -v node)" /tmp/atlas-review/runtime/node
          git rev-parse HEAD > /tmp/atlas-review/commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atlas-review-workspace
          path: /tmp/atlas-review
          retention-days: 1
          if-no-files-found: error
