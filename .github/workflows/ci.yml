name: Control Atlas CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly deep browser and accessibility sweep. It runs only when main holds a
    # commit the sweep has not tested (see sweep-gate), so quiet weeks cost nothing.
    - cron: '37 6 * * 0'
    - cron: '17 7 * * 3'
    - cron: '17 9 1 * *'
  workflow_dispatch:
    inputs:
      task:
        description: Validation task to run
        required: true
        default: standard
        type: choice
        options: [standard, nightly, refresh, recover-refresh-pr, oscal, lighthouse-ab]
      refresh_run_id:
        description: Completed refresh run whose data and repository gates passed
        required: false
      refresh_head_sha:
        description: Full SHA of the preserved automation/source-refresh snapshot
        required: false
      before_ref:
        description: Lighthouse A/B baseline ref
        required: false
        default: v1.0.0
      after_ref:
        description: Lighthouse A/B candidate ref
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number ||
      github.event.schedule || inputs.task || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  changes:
    name: Change map
    if: >-
      ${{ github.event_name == 'push' || github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.task == 'standard') }}
    runs-on: ubuntu-latest
    outputs:
      evidence_only: ${{ steps.scope.outputs.evidence_only }}
      content_changed: ${{ steps.scope.outputs.content_changed }}
      automation_changed: ${{ steps.scope.outputs.automation_changed }}
      automation_only: ${{ steps.scope.outputs.automation_only }}
      build_mode: ${{ steps.scope.outputs.build_mode }}
      build_required: ${{ steps.scope.outputs.build_required }}
      unit_required: ${{ steps.scope.outputs.unit_required }}
      browser_required: ${{ steps.scope.outputs.browser_required }}
      accessibility_required: ${{ steps.scope.outputs.accessibility_required }}
      lighthouse_required: ${{ steps.scope.outputs.lighthouse_required }}
      data_required: ${{ steps.scope.outputs.data_required }}
      security_required: ${{ steps.scope.outputs.security_required }}
      workflow_lint_required: ${{ steps.scope.outputs.workflow_lint_required }}
      ui_review_required: ${{ steps.review.outputs.ui_review_required }}
      ui_review_routes: ${{ steps.review.outputs.ui_review_routes }}
      ui_review_reason: ${{ steps.review.outputs.ui_review_reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch only the comparison base
        id: base
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          base="$EVENT_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          git diff --check "$base..$GITHUB_SHA"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Classify changed scope once
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        shell: bash
        run: |
          node tools/classify-change-scope.mjs \
            --base "$BASE_SHA" \
            --head "$GITHUB_SHA" \
            --json ci-change-map.json >> "$GITHUB_OUTPUT"
          cat ci-change-map.json

      - name: Select the public routes a person has to look at
        id: review
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        shell: bash
        run: |
          node tools/ui-review-routes.mjs \
            --base "$BASE_SHA" \
            --head "$GITHUB_SHA" \
            --json ci-ui-review.json >> "$GITHUB_OUTPUT"
          cat ci-ui-review.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-change-map
          path: |
            ci-change-map.json
            ci-ui-review.json
          if-no-files-found: error
          retention-days: 2

  evidence:
    name: Evidence integrity
    needs: changes
    if: ${{ needs.changes.outputs.evidence_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node --test tests/change-scope.test.mjs tests/release-evidence.test.mjs

  automation:
    name: Automation contracts
    needs: changes
    if: ${{ needs.changes.outputs.automation_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:automation
      - run: npm run test:ci-contracts

  content:
    name: Documentation contracts
    needs: changes
    if: ${{ needs.changes.outputs.content_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run hygiene:check
      - run: npm run test:documentation-contracts

  fast:
    name: Lint, types, and contracts
    needs: [changes, generated]
    if: >-
      ${{ always() &&
          needs.changes.result == 'success' &&
          needs.changes.outputs.evidence_only != 'true' &&
          needs.changes.outputs.automation_only != 'true' &&
          (needs.changes.outputs.build_required == 'true' ||
           needs.changes.outputs.unit_required == 'true') &&
          (needs.generated.result == 'success' || needs.generated.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Independently verify automated source admission
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'automation/source-refresh' }}
        env:
          CONTROL_ATLAS_SOURCE_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$CONTROL_ATLAS_SOURCE_BASELINE_REF"
          node tools/verify-refresh-admission.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: ${{ needs.generated.result == 'success' }}
        with:
          name: generated-data
          path: data/generated
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run test:ci-contracts

  generated:
    name: Prepare reproducible generated data
    needs: changes
    if: >-
      ${{ needs.changes.outputs.build_required == 'true' ||
          needs.changes.outputs.unit_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Calculate generated-data cache key
        id: generated-key
        run: echo "key=$(node tools/generated-data-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore generated-data cache
        id: generated-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/generated
          key: generated-data-${{ runner.os }}-v3-${{ steps.generated-key.outputs.key }}
      - name: Reproduce changed data from a clean state
        if: ${{ needs.changes.outputs.data_required == 'true' }}
        run: npm run verify:generated-reproducibility
      - name: Generate data on a cold cache
        if: >-
          ${{ needs.changes.outputs.data_required != 'true' &&
              steps.generated-cache.outputs.cache-hit != 'true' }}
        run: npm run generate:data
      - name: Reject generator writes outside derived output
        shell: bash
        run: |
          unexpected="$(git status --short --untracked-files=all -- . ':(exclude)data/generated/**')"
          if [[ -n "$unexpected" ]]; then
            echo "Generation changed canonical repository inputs:"
            echo "$unexpected"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-data
          path: data/generated
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

  windows-process:
    name: Windows process launch
    needs: changes
    if: ${{ needs.changes.outputs.build_required == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run test:process-launch

  unit:
    name: Unit and component tests
    needs: [changes, generated]
    if: ${{ needs.changes.outputs.unit_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: generated-data
          path: data/generated
      - run: npm test

  build:
    name: Build immutable site artifact
    needs: [changes, generated]
    if: ${{ needs.changes.outputs.build_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Pulse product events are derived from Git: merged pull requests on the
      # first-parent history of the built commit and tags reachable from it.
      # Commits and tags only (no trees or blobs), so the checkout stays small.
      - name: Fetch commit history and release tags for Pulse
        shell: bash
        run: git fetch --no-recurse-submodules --filter=tree:0 --unshallow --tags origin "$GITHUB_SHA" '+refs/heads/main:refs/remotes/origin/main'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: generated-data
          path: data/generated
      - name: Build once
        env:
          CONTROL_ATLAS_COMMIT_SHA: ${{ github.sha }}
        run: npm run build:site:incremental
      - run: npm run verify:site-artifact -- --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-build
          path: dist/site
          if-no-files-found: error
          retention-days: 2

  contracts:
    name: Static, data, and Guardian contracts
    needs: [changes, build]
    if: ${{ needs.changes.outputs.build_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist/site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: generated-data
          path: data/generated
      - run: npm run verify:contracts

  browser:
    name: Browser shard ${{ matrix.shard }}/2
    needs: [changes, build]
    if: ${{ needs.changes.outputs.browser_required == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist/site
      - name: Run semantic browser contracts
        env:
          PLAYWRIGHT_BROWSER: chromium
          PLAYWRIGHT_FULLY_PARALLEL: '1'
          PLAYWRIGHT_WORKERS: '2'
        run: npm run test:e2e:smoke -- --shard=${{ matrix.shard }}/2
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  accessibility:
    name: Accessibility
    needs: [changes, build]
    if: ${{ needs.changes.outputs.accessibility_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist/site
      - run: npm run test:a11y:smoke

  visual:
    name: Deliberate visual regression
    needs: [changes, build]
    if: ${{ needs.changes.outputs.browser_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist/site
      - name: Compare deliberate layout snapshots or bootstrap the first baseline
        shell: bash
        run: |
          if compgen -G 'tests/e2e/visual-regression.spec.mjs-snapshots/*.png' > /dev/null; then
            npm run test:visual
          else
            npm run test:visual -- --update-snapshots
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: visual-regression-baselines
          path: tests/e2e/visual-regression.spec.mjs-snapshots
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: visual-regression-failures
          path: test-results
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    needs: [changes, build]
    if: ${{ needs.changes.outputs.lighthouse_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist/site
      - run: npm run test:performance:ci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-ci
          path: artifacts/lighthouse-ci
          if-no-files-found: ignore
          retention-days: 7

  ui-review:
    name: UI review renders
    needs: [changes, build]
    if: ${{ needs.changes.outputs.ui_review_required == 'true' && needs.changes.outputs.build_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist/site

      - name: Serve the candidate build
        run: |
          PORT=4317 CONTROL_ATLAS_PLAYWRIGHT_SERVER=1 node tools/serve-static-site.mjs &
          for _ in $(seq 1 30); do
            curl --silent --fail http://localhost:4317/release.json > /dev/null && break
            sleep 1
          done

      - name: Capture candidate renders with the real design package
        env:
          ROUTES: ${{ needs.changes.outputs.ui_review_routes }}
        run: |
          node tools/capture-ui-review.mjs \
            --base-url http://localhost:4317 \
            --out artifacts/ui-review/candidate \
            --label candidate \
            --routes "$ROUTES"

      # Base renders come from the deployed site, which is main built with the
      # same design package. Building main again here would double the job for
      # renders nobody would trust more.
      - name: Capture base renders from the deployed site
        continue-on-error: true
        env:
          ROUTES: ${{ needs.changes.outputs.ui_review_routes }}
          BASE_URL: https://rambulls.github.io/control-atlas
        run: |
          node tools/capture-ui-review.mjs \
            --base-url "$BASE_URL" \
            --out artifacts/ui-review/base \
            --label base \
            --routes "$ROUTES"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: ui-review-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ui-review
          if-no-files-found: error
          retention-days: 30

      - name: Say where the renders are and what they do not prove
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ROUTES: ${{ needs.changes.outputs.ui_review_routes }}
          REASON: ${{ needs.changes.outputs.ui_review_reason }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          {
            echo "## UI review renders"
            echo
            echo "**[Download the ui-review artifact]($ARTIFACT_URL)** — head \`$HEAD_SHA\`"
            echo
            echo "Routes selected ($REASON): \`$ROUTES\`"
            echo
            echo "Each route is captured at 1440 desktop and 390 phone, first viewport and full page,"
            echo "against the real design-token package. \`base/\` is the deployed main; \`candidate/\` is this head."
            echo
            echo "> These are renders for a person to look at. Layout, accessibility and performance"
            echo "> contracts passing elsewhere in this run is not visual or copy approval, and nothing"
            echo "> in this job approves anything. Approval is the \`visual-approved\` label, applied by"
            echo "> the owner after looking, and it is removed automatically when the head changes."
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: Workflow syntax and action pins
    needs: changes
    if: ${{ needs.changes.outputs.workflow_lint_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate workflows with actionlint 1.7.12
        shell: bash
        run: |
          version='1.7.12'
          archive="actionlint_${version}_linux_amd64.tar.gz"
          checksums="actionlint_${version}_checksums.txt"
          release="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl --fail --silent --show-error --location --remote-name "${release}/${archive}"
          curl --fail --silent --show-error --location --remote-name "${release}/${checksums}"
          grep "  ${archive}$" "$checksums" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --no-same-owner actionlint
          ./actionlint
          node tools/check-action-pins.mjs

  required:
    name: Required CI
    if: ${{ always() && needs.changes.result != 'skipped' }}
    needs: [changes, evidence, automation, content, fast, generated, windows-process, unit, build, contracts, browser, accessibility, visual, lighthouse, workflow-lint, ui-review]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected gate
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          echo "Gate results: $RESULTS"
          if grep -Eq 'failure|cancelled' <<< "$RESULTS"; then
            exit 1
          fi

  checks:
    name: checks
    if: ${{ always() && needs.required.result != 'skipped' }}
    needs: required
    runs-on: ubuntu-latest
    steps:
      - name: Publish branch-protection compatibility status
        env:
          REQUIRED_RESULT: ${{ needs.required.result }}
        run: test "$REQUIRED_RESULT" = success

  sweep-gate:
    name: Is a deep check due
    # Re-testing a commit that already went through the same job proves nothing.
    # The weekly deep sweep and the monthly OSCAL check run only for a commit
    # that has not been through them. Manual dispatch always runs.
    if: ${{ github.event.schedule == '37 6 * * 0' || github.event.schedule == '17 9 1 * *' }}
    runs-on: ubuntu-latest
    outputs:
      nightly_due: ${{ steps.nightly.outputs.due }}
      oscal_due: ${{ steps.oscal.outputs.due }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: nightly
        if: ${{ github.event.schedule == '37 6 * * 0' }}
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', SHA: '${{ github.sha }}', RUN_ID: '${{ github.run_id }}', JOB_NAME: 'Nightly build and contracts' }
        run: node tools/sweep-due.mjs
      - id: oscal
        if: ${{ github.event.schedule == '17 9 1 * *' }}
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', SHA: '${{ github.sha }}', RUN_ID: '${{ github.run_id }}', JOB_NAME: 'Independent OSCAL validation' }
        run: node tools/sweep-due.mjs

  nightly-build:
    name: Nightly build and contracts
    needs: sweep-gate
    if: >-
      ${{ !cancelled() &&
          ((github.event.schedule == '37 6 * * 0' && needs.sweep-gate.outputs.nightly_due == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.task == 'nightly')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run generate:data
      - run: npm run build:site:incremental
        env:
          CONTROL_ATLAS_COMMIT_SHA: ${{ github.sha }}
      - run: npm run verify:quality
      - run: npm run verify:site-artifact -- --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-site-build
          path: dist/site
          if-no-files-found: error
          retention-days: 2

  nightly-browser:
    name: Nightly ${{ matrix.browser }} shard ${{ matrix.shard }}/2
    needs: nightly-build
    # Explicit: a skipped sweep-gate upstream of nightly-build would otherwise skip this job
    # silently, and a browser suite that did not run must never look like a pass.
    if: ${{ !cancelled() && needs.nightly-build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nightly-site-build
          path: dist/site
      - name: Run complete browser suite
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.browser }}-${{ matrix.shard }}.zip
          PLAYWRIGHT_FULLY_PARALLEL: '1'
          PLAYWRIGHT_WORKERS: '2'
        # One retry. WebKit on a shared runner fails a different interaction spec each run (each passes when
        # rerun), so a spec must fail twice to fail the sweep. Flaky specs are still listed in the report.
        run: npm run test:e2e:run -- --shard=${{ matrix.shard }}/2 --retries=1 --reporter=blob,github
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: nightly-blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          retention-days: 2

  nightly-accessibility:
    name: Nightly complete accessibility
    needs: nightly-build
    # Explicit: a skipped sweep-gate upstream of nightly-build would otherwise skip this job
    # silently, and a browser suite that did not run must never look like a pass.
    if: ${{ !cancelled() && needs.nightly-build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nightly-site-build
          path: dist/site
      - name: Run complete accessibility suite
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-accessibility.zip
        run: npm run test:a11y:run -- --reporter=blob,github
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: nightly-blob-accessibility
          path: blob-report
          if-no-files-found: error
          retention-days: 2

  sweep-alert:
    name: Scheduled job alert
    # One issue per sweep: opened when it turns red, brought up to date only if a
    # different set of jobs is failing, closed when it recovers. A solo maintainer
    # cannot triage a nightly digest, and a permanently red job is
    # indistinguishable from a newly broken one. A job the sweep schedules that
    # was skipped counts as red, so a sweep that did not run cannot look green.
    if: >-
      ${{ !cancelled() &&
          ((github.event.schedule == '37 6 * * 0' && needs.sweep-gate.outputs.nightly_due == 'true') ||
           github.event.schedule == '17 7 * * 3' ||
           (github.event_name == 'workflow_dispatch'
            && (inputs.task == 'nightly' ||
                (inputs.task == 'refresh' && github.ref == 'refs/heads/main')))) }}
    needs: [sweep-gate, nightly-build, nightly-browser, nightly-accessibility, refresh]
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Open, update or resolve the sweep alert
        # Which jobs must have succeeded is decided by the sweep, not by this
        # step: a job the sweep schedules that was skipped counts as red.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SWEEP_KIND: ${{ (inputs.task == 'refresh' || github.event.schedule == '17 7 * * 3') && 'refresh' || 'nightly' }}
          RESULT_BUILD: ${{ needs.nightly-build.result }}
          RESULT_BROWSER: ${{ needs.nightly-browser.result }}
          RESULT_ACCESSIBILITY: ${{ needs.nightly-accessibility.result }}
          RESULT_REFRESH: ${{ needs.refresh.result }}
        run: node tools/report-sweep-alert.mjs

  nightly-report:
    name: Nightly browser report
    if: >-
      ${{ !cancelled() &&
          ((github.event.schedule == '37 6 * * 0' && needs.sweep-gate.outputs.nightly_due == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.task == 'nightly')) }}
    needs: [sweep-gate, nightly-browser, nightly-accessibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nightly-blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter=html all-blob-reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-playwright-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 14

  recover-refresh-pr:
    name: Recover validated refresh PR
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'recover-refresh-pr' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run refresh:recover-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_RUN_ID: ${{ inputs.refresh_run_id }}
          REFRESH_HEAD_SHA: ${{ inputs.refresh_head_sha }}

  refresh:
    name: Weekly validated data refresh
    if: >-
      ${{ github.event.schedule == '17 7 * * 3' ||
          (github.event_name == 'workflow_dispatch' && inputs.task == 'refresh' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Restore strict conditional source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .local/http-cache-v1
          key: source-http-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            source-http-v1-${{ runner.os }}-
      - name: Refresh validated build-time data
        run: npm run refresh:data
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Alert on quarantined sources and close recovered alerts
        if: ${{ always() && hashFiles('.local/source-refresh-results.json') != '' }}
        run: node tools/report-refresh-alerts.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stop early when no source changed materially
        # Dates and run timings are not changes. If nothing else moved and the
        # freshness dates are still recent, the tree is restored and the rest of
        # this job (browser install, full verification, pull request) is skipped.
        id: outcome
        run: node tools/classify-refresh-outcome.mjs
      - run: npm run resources:health
        if: ${{ steps.outcome.outputs.publish == 'true' }}
      - run: npx playwright install --with-deps chromium
        if: ${{ steps.outcome.outputs.publish == 'true' }}
      - name: Verify refreshed repository
        if: ${{ steps.outcome.outputs.publish == 'true' }}
        env:
          PLAYWRIGHT_WORKERS: '2'
        run: npm run precommit:incremental
      - run: npm run sbom:generate
        if: ${{ steps.outcome.outputs.publish == 'true' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ steps.outcome.outputs.publish == 'true' }}
        with:
          name: source-refresh-sbom-cdx-json
          path: artifacts/sbom.cdx.json
      - name: Restore tracked SBOM before source admission
        run: git restore --worktree -- artifacts/sbom.cdx.json
        if: ${{ steps.outcome.outputs.publish == 'true' }}
      - run: node scripts/report-refresh-diff.mjs refresh-pr-body.md
        if: ${{ steps.outcome.outputs.publish == 'true' }}
      - name: Create repository-scoped publisher token after validation
        if: ${{ steps.outcome.outputs.publish == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: refresh-app
        with:
          client-id: ${{ vars.REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          owner: RAMBULLS
          repositories: control-atlas
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ steps.outcome.outputs.publish == 'true' }}
        with:
          token: ${{ steps.refresh-app.outputs.token }}
          add-paths: |
            data/**
            maps/**
          branch: automation/source-refresh
          commit-message: 'chore(data): refresh public source snapshots'
          title: 'chore(data): refresh validated public source snapshots'
          body-path: refresh-pr-body.md
          draft: false
          delete-branch: true
          labels: data-refresh

  oscal:
    name: Independent OSCAL validation
    needs: sweep-gate
    if: >-
      ${{ !cancelled() &&
          ((github.event.schedule == '17 9 1 * *' && needs.sweep-gate.outputs.oscal_due == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.task == 'oscal')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:oscal:independent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oscal-cli-cross-check
          path: artifacts/oscal-cli/cross-check.json

  lighthouse-ab:
    name: Lighthouse A/B diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'lighthouse-ab' }}
    runs-on: ubuntu-latest
    env:
      BEFORE_REF: ${{ inputs.before_ref || 'v1.0.0' }}
      AFTER_REF: ${{ inputs.after_ref || github.sha }}
      MAX_MEDIAN_DROP: '3'
      ROUTE: '/#/explore?node=nist-800-53%3AAC-2&relationshipView=map'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Measure both refs on the same runner
        run: node tools/run-lighthouse-ab.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lighthouse-ab
          path: artifacts/lighthouse-ab
          if-no-files-found: warn
