name: Nightly Full Verification

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-full-verification
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Dependency audit
        run: npm run audit:deps
      - name: Calculate generated-data cache key
        id: generated-key
        shell: bash
        run: echo "key=$(node tools/generated-data-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore generated data
        id: generated-cache
        uses: actions/cache@v6
        with:
          path: data/generated
          key: generated-data-${{ runner.os }}-v1-${{ steps.generated-key.outputs.key }}
      - name: Build once from cached or source data
        env:
          CONTROL_ATLAS_COMMIT_SHA: ${{ github.sha }}
          GENERATED_CACHE_HIT: ${{ steps.generated-cache.outputs.cache-hit }}
        shell: bash
        run: |
          if [[ "$GENERATED_CACHE_HIT" == "true" ]]; then
            npm run build:site:incremental
          else
            echo "Generated data cache unavailable; rebuilding deterministically."
            npm run build:site
          fi
      - name: Static, data, contract, and Guardian gates
        run: npm run verify:quality
      - name: Verify exact-SHA site artifact
        run: npm run verify:site-artifact -- --sha "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-site-build
          path: dist/site
          if-no-files-found: error
          retention-days: 2

  e2e:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-site-build
          path: dist/site
      - name: Run functional shard ${{ matrix.shard }}/4
        env:
          PLAYWRIGHT_FULLY_PARALLEL: '1'
        run: npx playwright test --config playwright.e2e.config.mjs --shard=${{ matrix.shard }}/4 --reporter=blob
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-blob-e2e-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          retention-days: 2

  accessibility:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-site-build
          path: dist/site
      - name: Run complete accessibility suite
        run: npx playwright test --config playwright.a11y.config.mjs --reporter=blob
      - name: Upload accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-blob-accessibility
          path: blob-report
          if-no-files-found: error
          retention-days: 2

  visual-review:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      # Keep pixel comparisons aligned with the environment that produces the
      # reviewed Linux baselines in update-visual-baselines.yml.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - name: Install package-matched Chromium
        run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: nightly-site-build
          path: dist/site
      - name: Approved-layout visual comparison
        run: npm run test:visual
      - name: Upload visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-visual-evidence
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  report:
    if: ${{ !cancelled() }}
    needs: [e2e, accessibility, visual-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright shard reports
        run: npx playwright merge-reports --reporter=html all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 14
