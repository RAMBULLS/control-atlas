title = "Control Atlas gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public catalog identifiers and publisher-released artifacts containing credential-shaped instructional examples are not secrets"
# NIST OLIR public source-key identifiers (e.g. nist-olir-csf2-to-sp800-171):
# assigned to a variable named `source_key`, so gitleaks' generic-api-key
# heuristic trips on their entropy. These are published NIST reference-catalog
# identifiers, not secrets — exempt the exact value pattern, not a broad class.
regexes = [
  '''nist-olir-csf2-to-sp800-\d+''',
  # Exact public NIST catalog slug. The generic-api-key heuristic can flag it
  # when it is passed to an identifier-formatting helper in a unit test.
  '''^nist-800-171-rev2$''',
  # Exact public DoD Zero Trust newsletter source identifier. It is repeated
  # as document/source provenance across deterministic PDF fragments, so the
  # generic-api-key heuristic sees the identifier next to `*_key` fields.
  '''^dod-zt-newsletter-2024-11$''',
  # Exact public publication identifiers emitted by the governed source-review
  # artifact under `source_key`; none is a credential or authentication value.
  '''^mitre-d3fend-ontology$''',
  '''^nist-800-172-rev3$''',
  '''^nist-800-37-rev2$''',
  # Exact detector captures for two public NIST SP 1800-35 catalog keys. The
  # generic-api-key rule captures only the first 23/28 characters, so these
  # values intentionally match that bounded capture, not arbitrary NIST keys.
  '''^nist-sp-1800-35-e3b$''',
  '''^nist-sp-1800-35-csf2-mappi$''',
  # Exact detector captures for two additional public SP 1800-35 source keys
  # retrieved by the refresh. Gitleaks truncates both values at its generic
  # API-key capture boundary; these patterns cannot match arbitrary secrets.
  '''^nist-sp-1800-35-critical-soft$''',
  '''^nist-sp-1800-35-csf2-$''',
]
