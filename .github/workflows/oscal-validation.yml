name: Independent OSCAL validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:oscal:independent
      - uses: actions/upload-artifact@v7
        with:
          name: oscal-cli-cross-check
          path: artifacts/oscal-cli/cross-check.json
