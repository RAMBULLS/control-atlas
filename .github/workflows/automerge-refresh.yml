name: Merge validated source refresh

on:
  workflow_run:
    workflows: [Control Atlas CI, Control Atlas Security, Control Atlas Deploy]
    types: [completed]
    branches: [automation/source-refresh, main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: source-refresh-automerge
  cancel-in-progress: false

jobs:
  release-health:
    name: Track production release health
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Track the latest main release failure or verified recovery
        run: node tools/report-release-health.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OBSERVED_RUN_ID: ${{ github.event.workflow_run.id }}

  merge:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_branch == 'automation/source-refresh' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: refresh-app
        with:
          client-id: ${{ vars.REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          owner: RAMBULLS
          repositories: control-atlas
          permission-contents: write
          permission-pull-requests: write
      - name: Require independent gates and merge the exact tested commit
        run: node tools/automerge-source-refresh.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_MERGE_TOKEN: ${{ steps.refresh-app.outputs.token }}
