name: Zero Trust baseline reproduction

on:
  pull_request:
    paths:
      - '.github/workflows/zero-trust-audit-reproduction.yml'

permissions:
  contents: read

jobs:
  reproduce:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/zero-trust-compare-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: b19c80d06e7252d8249009f5291770a07115f0f9
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the locked baseline toolchain
        run: npm ci
      - name: Prepare reproducible offline analysis inputs
        shell: bash
        run: |
          mkdir -p /tmp/zt-audit
          git archive --format=tar.gz --output=/tmp/zt-audit/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/zt-audit/source-sha.txt
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf /tmp/zt-audit/toolchain.tar.gz node_modules
          sha256sum /tmp/zt-audit/*.tar.gz > /tmp/zt-audit/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zero-trust-baseline-b19c80d0
          path: /tmp/zt-audit/
          retention-days: 2
          if-no-files-found: error
